name: recount
on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
jobs:
  recount:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - run: node check.mjs
      - run: node check.mjs --selftest
