<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="t d">
<title id="t">Who holds the keys of ERC-3643 token issuances</title>
<desc id="d">Of 3427 issuances, 97.2% have a single key as owner and 0.3% need more than one party. Of 1052 active issuances, 95.7% and 0.8%.</desc>
<rect width="800" height="330" fill="#ffffff"/>
<text x="30" y="46" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#111827">Who holds the keys of ERC-3643 token issuances?</text>
<text x="30" y="72" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Polygon and Ethereum, read-only count, 16 November 2026</text>
<text x="30" y="129" font-family="system-ui, sans-serif" font-size="15" fill="#111827">All issuances (3427)</text>
<rect x="190" y="105" width="544.3" height="34" fill="#1f2937"/>
<rect x="734.3" y="105" width="1.7" height="34" fill="#16a34a"/>
<rect x="736.0" y="105" width="14.0" height="34" fill="#d1d5db"/>
<text x="202" y="128" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">97.2% single key</text>
<text x="190" y="159" font-family="system-ui, sans-serif" font-size="13" fill="#111827">0.3% need more than one party, 2.5% other</text>
<text x="30" y="209" font-family="system-ui, sans-serif" font-size="15" fill="#111827">Active issuances (1052)</text>
<rect x="190" y="185" width="535.9" height="34" fill="#1f2937"/>
<rect x="725.9" y="185" width="4.5" height="34" fill="#16a34a"/>
<rect x="730.4" y="185" width="19.6" height="34" fill="#d1d5db"/>
<text x="202" y="208" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">95.7% single key</text>
<text x="190" y="239" font-family="system-ui, sans-serif" font-size="13" fill="#111827">0.8% need more than one party, 3.5% other</text>
<rect x="30" y="268" width="14" height="14" fill="#1f2937"/><text x="52" y="280" font-family="system-ui, sans-serif" font-size="13" fill="#111827">single key: one account, or a Safe that needs one signature</text>
<rect x="30" y="290" width="14" height="14" fill="#16a34a"/><text x="52" y="302" font-family="system-ui, sans-serif" font-size="13" fill="#111827">more than one party: Safe with 2+ signatures, or a timelock</text>
<text x="520" y="318" font-family="system-ui, sans-serif" font-size="12" fill="#4b5563">github.com/holistis/erc3643-key-census</text>
</svg>
